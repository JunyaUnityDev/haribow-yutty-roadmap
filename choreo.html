<style>

.wrap{max-width:760px;margin:0 auto;padding:30px 16px 56px}

.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.chip .c{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font-family:inherit;color:inherit;transition:transform .12s}
.card:active{transform:scale(.97)}
.thumb{position:relative;aspect-ratio:3/4;background:#222 center/cover no-repeat}
.thumb .no{position:absolute;left:8px;top:8px;background:rgba(28,24,19,.72);color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px}

.meta .i{font-size:11px;color:var(--mut);margin-left:6px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11px;background:var(--soft);color:var(--mut);border-radius:5px;padding:1px 6px}
.tag.r{background:var(--acw);color:var(--blue);font-weight:700}
.empty{color:var(--mut);font-size:13px;padding:20px 0;text-align:center}
.foot{color:var(--faint);font-size:11px;text-align:center;margin-top:24px}
/* モーダル */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px}
.modal[hidden]{display:none}
.modal video{max-width:100%;max-height:70vh;border-radius:10px;background:#000}
.modal iframe{width:min(400px,calc(100vw - 28px),calc(70vh * 9 / 16));aspect-ratio:9/16;height:auto;border:0;border-radius:10px;background:#000;flex:0 0 auto}
.mhead{color:#fff;font-size:13px;margin-bottom:10px;text-align:center;max-width:100%;padding:0 30px}
.mhead b{font-family:var(--mono)}
.mbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.mbtn{border:0;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:#fffdfa;color:var(--ink)}
.mbtn.main{background:var(--blue);color:#fff}
.mbtn[disabled]{opacity:.45;cursor:default}
.mclose{position:absolute;top:10px;right:14px;background:none;border:0;color:#fff;font-size:30px;cursor:pointer;line-height:1}

function showExpl(){if(!cur||!cur.yt)return;mv.pause();mv.hidden=true;mf.hidden=false;mf.src="https://www.youtube.com/embed/"+cur.yt+"?autoplay=1&playsinline=1";document.getElementById("bExpl").className="mbtn main";document.getElementById("bChoreo").className="mbtn";}
function open_(no){
  cur=ITEMS.find(i=>i.no===no);if(!cur)return;
  document.getElementById("mhead").innerHTML='<b>#'+String(cur.no).padStart(2,"0")+'</b>　'+cur.date+'　'+cur.inst+'<br>'+cur.tags.map(esc).join(" ・ ");
  mv.src=cur.v;
  const be=document.getElementById("bExpl");
  if(cur.yt){be.disabled=false;be.textContent="解説を見る（約"+Math.max(1,Math.round(cur.sec/60))+"分）";}else{be.disabled=true;be.textContent="解説は準備中";}
  document.getElementById("modal").hidden=false;showChoreo();
}
function close_(){mv.pause();mv.removeAttribute("src");mv.load();mf.src="";document.getElementById("modal").hidden=true;cur=null;}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(c){filter=c.dataset.k;drawChips();drawGrid();return;}
  const k=e.target.closest(".card");if(k){open_(+k.dataset.no);return;}
  if(e.target.id==="mclose"||e.target.id==="modal"){close_();return;}
  if(e.target.id==="bChoreo"){showChoreo();return;}
  if(e.target.id==="bExpl"){showExpl();return;}
});
drawChips();drawGrid();
</script>
</body></html>
