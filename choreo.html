<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>コレオライブラリ｜HARIBOW ONLINE LESSON</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#b25c33;--acw:#f4e7df;--bg:#faf7f2;--card:#fffdfa;--soft:#f1eee7;--line:#e6e1d8;--gold:#a9842b;--ink:#1c1813;--mut:#6c655c;--faint:#a8a196;--serif:"Shippori Mincho",serif;--mono:"JetBrains Mono",ui-monospace,monospace;}
*{box-sizing:border-box}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.64;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:30px 16px 56px}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--blue);font-weight:700;margin:0 0 7px}
h1{font-size:24px;margin:0 0 10px;font-family:var(--serif);font-weight:700;line-height:1.4}
.back{display:inline-block;font-size:13px;color:var(--mut);text-decoration:none;margin-bottom:16px}
.back:hover{color:var(--blue)}
.lead{color:var(--mut);font-size:14px;margin:0 0 14px}
.howto{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 18px;font-size:13.5px;color:var(--mut)}
.howto b{color:var(--ink)}
.howto ol{margin:6px 0 0;padding-left:20px}
.howto li{margin:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.2}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.chip .c{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}
.count{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font-family:inherit;color:inherit;transition:transform .12s}
.card:active{transform:scale(.97)}
.thumb{position:relative;aspect-ratio:3/4;background:#222 center/cover no-repeat}
.thumb .no{position:absolute;left:8px;top:8px;background:rgba(28,24,19,.72);color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px}
.thumb .play{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,253,250,.9);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px}
.meta{padding:9px 10px 11px}
.meta .d{font-family:var(--mono);font-size:11px;color:var(--faint)}
.meta .i{font-size:11px;color:var(--mut);margin-left:6px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11px;background:var(--soft);color:var(--mut);border-radius:5px;padding:1px 6px}
.tag.r{background:var(--acw);color:var(--blue);font-weight:700}
.empty{color:var(--mut);font-size:13px;padding:20px 0;text-align:center}
.foot{color:var(--faint);font-size:11px;text-align:center;margin-top:24px}
/* モーダル */
.modal{position:fixed;inset:0;background:rgba(20,17,13,.97);z-index:100;display:flex;flex-direction:column;overflow-y:auto;padding:50px 14px 28px;-webkit-overflow-scrolling:touch}
.modal[hidden]{display:none}
.minner{margin:auto 0;display:flex;flex-direction:column;align-items:center;width:100%}
.modal video{max-width:100%;max-height:56vh;border-radius:10px;background:#000}
.modal video.mirror{transform:scaleX(-1)}
.modal iframe{width:min(400px,calc(100vw - 28px),calc(62vh * 9 / 16));aspect-ratio:9/16;height:auto;border:0;border-radius:10px;background:#000;flex:0 0 auto}
.mhead{color:#fff;font-size:13px;margin-bottom:10px;text-align:center;max-width:100%;padding:0 30px}
.mhead b{font-family:var(--mono)}
.mhint{color:#b9b1a6;font-size:11.5px;margin-top:4px}
.mback{background:none;border:0;color:#e8c9b8;font:inherit;font-size:13px;cursor:pointer;margin-bottom:6px;padding:4px 0}
.tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.tool{border:1px solid rgba(255,255,255,.28);background:none;color:#ddd;border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;font-family:var(--mono)}
.tool.on{background:#fffdfa;color:var(--ink);border-color:#fffdfa}
.mbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.mbtn{border:0;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:#fffdfa;color:var(--ink)}
.mbtn.main{background:var(--blue);color:#fff}
.mbtn[disabled]{opacity:.45;cursor:default}
.mtext{color:#eee;font-size:13.5px;max-width:min(440px,100%);margin:14px 0 0;line-height:1.7}
.mtext b{color:#fff}
.mlink{background:none;border:0;padding:0;color:#e8c9b8;font:inherit;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.mtag{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:7px;padding:5px 10px;margin:3px;font:inherit;font-size:13px;min-height:30px}
.mtag.r{background:#b25c33}
.mtag.has{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.mtag.has::after{content:" ›"}
.dictbar{display:none;background:var(--acw);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:13px;color:var(--ink)}
.dictbar.go{cursor:pointer}
.dictbar b{color:var(--blue)}
.dictlist{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px}
.dictlist summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.dictlist summary::-webkit-details-marker{display:none}
.dictlist summary .sm{font-weight:500;color:var(--mut);font-size:12px}
.dictlist summary::after{content:"›";margin-left:auto;color:var(--faint);font-size:21px;line-height:1;transform:rotate(90deg)}
.dictlist .dl{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px}
.dictlist .dl button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.dictlist .dl button.r{border-color:var(--blue);color:var(--blue);font-weight:700}
.dictlist .dlh{font-size:12px;color:var(--mut);padding:0 16px 6px}
.mclose{position:fixed;top:8px;right:12px;background:rgba(20,17,13,.6);border:0;color:#fff;font-size:30px;cursor:pointer;line-height:1;width:44px;height:44px;border-radius:50%;z-index:101}
.legend{font-size:11.5px;color:var(--faint);margin:-8px 0 12px}
.legend i{display:none;display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--acw);border:1px solid var(--blue);vertical-align:-1px;margin-right:4px}
.chip.more{border-style:dashed}
.first{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:3px 9px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.steps{margin-top:6px;font-size:12.5px;color:var(--mut)}
.thumb .badge{position:absolute;left:8px;bottom:8px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.thumb .seen{position:absolute;left:8px;top:30px;background:rgba(255,253,250,.9);color:var(--mut);font-size:10.5px;border-radius:5px;padding:1px 6px}
.meta{padding:7px 8px 9px}
.meta .tags{margin-top:0}
.lead{font-size:13.5px;margin:0 0 14px}
.flow{display:flex;align-items:flex-start;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px 12px;margin:0 0 12px}
.fs{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink);font-weight:700;text-align:center;line-height:1.3}
.fs svg{width:30px;height:30px;fill:none;stroke:var(--blue);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--blue)}
.fs small{display:block;font-weight:500;color:var(--faint);font-size:10.5px;font-family:var(--mono)}
.farr{color:var(--line);font-size:18px;margin-top:6px;flex:0 0 auto}
.hero{display:flex;align-items:center;gap:14px;width:100%;background:var(--acw);border:1px solid #e6cdbf;border-radius:14px;padding:10px;margin:0 0 14px;cursor:pointer;font:inherit;color:inherit;text-align:left}
.hero img{width:64px;height:85px;object-fit:cover;border-radius:9px;flex:0 0 auto}
.hero .hl{font-size:11px;color:var(--blue);font-weight:700;letter-spacing:.08em;font-family:var(--mono)}
.hero .ht{font-size:16px;font-weight:700;margin:2px 0}
.hero .hs{font-size:12px;color:var(--mut)}
.hero .hp{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto}
.legend .sw{display:inline-block;font-size:10.5px;background:var(--acw);color:var(--blue);font-weight:700;border-radius:4px;padding:0 5px;margin-right:4px}
.try{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;color:#f1e3da;font-size:13px;font-weight:700}
.try svg{width:26px;height:26px;fill:none;stroke:#e8a27f;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:#e8a27f}
.stars{font-size:11px;color:var(--blue);letter-spacing:1px;margin-top:4px;font-family:var(--mono)}
.stars i{font-style:normal;color:var(--line)}
.thumb .ok{position:absolute;left:8px;bottom:8px;display:flex;gap:4px}
.thumb .ok span{background:#fffdfa;color:var(--ink);font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px}
.thumb .ok span.r{background:#a9842b;color:#fff}
.thumb .ok span.n{background:#5a7fa0;color:#fff}
.pass{background:rgba(255,253,250,.07);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 14px;margin-top:14px;width:min(440px,100%);color:#eee;font-size:13px;line-height:1.65}
.pass h4{margin:0 0 6px;font-size:13px;color:#fff;display:flex;align-items:center;gap:8px}
.pass h4 .st i{font-style:normal;color:rgba(255,255,255,.22)}
.pass h4 .st{margin-left:auto;font-size:11px;color:#e8a27f;font-family:var(--mono)}
.pass ol{margin:0;padding-left:20px}
.pass .lv{margin-top:8px;font-size:12px;color:#b9b1a6}
.pass .lv b{color:#fff}
.got{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;margin-left:4px;color:#fff}
.got.n{background:#5a7fa0}.got.r{background:#a9842b}
.sub{display:flex;gap:8px;margin-top:12px;width:min(440px,100%)}
.sub a{flex:1;text-align:center;text-decoration:none;color:#fff;font-weight:700;font-size:14px;border-radius:12px;padding:12px 6px;background:#06c755}
.sub a.r{background:#e09000}
.subhint{font-size:11.5px;color:#b9b1a6;margin-top:6px;width:min(440px,100%);text-align:center}
.rmback{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--blue);border-radius:14px;padding:10px 12px;margin:0 0 12px;text-decoration:none;color:inherit}
.rmback .ar{color:var(--blue);font-size:22px;line-height:1;flex:none}
.rmback .ths{display:flex;gap:4px;flex:none}
.rmback .ths img{width:40px;aspect-ratio:3/4;object-fit:cover;border-radius:6px;display:block;background:#222}
.rmback .tx{flex:1;min-width:0}
.rmback .t1{font-weight:700;font-size:14px;color:var(--ink)}
.rmback .t2{font-size:11.5px;color:var(--mut);margin-top:2px}
@media(max-width:380px){.rmback .ths img:nth-child(n+3){display:none}}
</style></head><body><div class="wrap">

 "オーヴ":{"road":true,"d":"ロープを跳ばずに“またぐ”動き。足幅を前後に大きく開き、残った足を真上に抜く。他の技から縄を抜ける共通動作にもなる。","v":"videos/dict/ove.mp4","yt":"63-VKq668sU"},
 "スライド":{"road":true,"d":"足が地面についた瞬間に、体を平行移動させる技。地面の反発をもらうと速い。前後スライドの習得は必須。","v":"videos/dict/slide.mp4","yt":"4tUHbgwHmeQ"},
 "ペダル":{"road":true,"d":"つま先とかかとを交互に踏みかえる中で、足裏の下にロープを通過させる技。引っかかったら重心を上下に。","v":"videos/dict/pedal.mp4","yt":"ER4QCas1ne4"},
 "3ステップ":{"road":true,"d":"ワン（踏みに行く）・エン（太もも90度まで上げる）・ツー（後ろに置く）の3カウントのステップ。ダンスステップ。","v":"videos/dict/step3.mp4","yt":"DE0E9OFlwDY"},
 "ヒールロック":{"road":true,"d":"着地と同時に素早く片足へ体重を移し、かかとで姿勢をキープする技。ムーブに緩急を出せる。","v":"videos/dict/heellock.mp4","yt":"9hpXiLQgefg"},
 "ラグジャンプ":{"road":true,"d":"足の接地を意図的に長く取り、カウントで“浮き始める”。溜め＝ラグを作って跳ぶ。最難関。","v":"videos/dict/rag.mp4","yt":"9e6-saodELs"},
 "トリプ":{"road":true,"d":"「と・り・ぷ」の3連（1カウントに3回）で刻むリズム。3つ目の音の直後にオーヴで縄を抜けると引っかかりにくい。","v":"videos/dict/trip.mp4","yt":"6rvGkxTpJZQ"},
 "スイング":{"d":"頭を振り子のように動かしながら跳ぶ技。ペダルやオーヴにつなげると相性がいい。","tip":"ジャンプをせず、重心を落としながら（ダウンしながら）頭の位置を回す。","v":"videos/dict/swing.mp4","ex":[["スイング＋オーヴ","videos/dict/set_swing_ove.mp4"],["スイング→ペダル","videos/dict/set_swing_pedal.mp4"]]},
 "レット":{"d":"トリプ（タ・タ・タ）の1つ目と3つ目だけを取り、2つ目は抜くリズムの取り方。シャッフルビートとも呼ぶ。","tip":"3つ目（レット）の音を取った直後に、後ろから来る縄をオーヴでまたぐと引っかかりにくい。","v":"videos/dict/let.mp4","v2":"videos/dict/let_card.mp4","ex":[["レット＋オーヴ","videos/dict/set_let_ove.mp4"]]},
 "ZDステップ":{"d":"ダンスステップのリーボックとトレインをつなげた技。","tip":"ペダルをしながら、反対の足を踏み込む動作と上げる動作を練習すると感覚をつかみやすい。","v":"videos/dict/zd.mp4"},
 "空中ヒット":{"d":"空中にいる間に足を伸ばし、ヒットのような質感を出す技。","tip":"空中で足をお腹に引きつけると、大きくヒットを打てる。","v":"videos/dict/airhit.mp4"},
 "ボディポップ":{"d":"地面からの反発を使い、体を弾くように動かす技。","tip":"足裏全体で着地すると反発をもらいやすい。初動を速くすると引っかかりにくい。","v":"videos/dict/bodypop.mp4"},
 "ポップジャンプ":{"d":"地面からの反発を使い、弾かれるような質感を出す動き。","tip":"足裏全体で着地すると反発をもらいやすい。かかとを地面につけることを意識。","v":"videos/dict/popjump.mp4"},
 "ダウン":{"d":"ダウン（重心を落とす動き）をしながら跳ぶ、基本の技。スイングのコツにも出てくる。","tip":"ロープが来る直前まで待ち、ジャンプをせずに体重を落とすだけで体を浮かせる。頭の高さは、立っているときより高くならない。","v":"videos/dict/down.mp4"}
}
;
const ROAD=["オーヴ","スライド","ペダル","3ステップ","ヒールロック","ラグジャンプ","トリプ"];
const FIRST=30;
const U=(new URLSearchParams(location.search).get("u")||"").trim();
if(U)document.getElementById("back").href="index.html?u="+encodeURIComponent(U);
let filter="all", showMore=false;
const OA="578mjivx";
const GAS_URL="https://script.google.com/macros/s/AKfycbzk8aSKX2KPs3lYJ4mW1yS5-XrAzU5mg5EM_d0bf2Ev0VTdZk46ph4TqNCyEHhZ-LGCHQ/exec";
let OKN=new Set(),OKR=new Set();
function lbl(no){return "コレオ／コレオ#"+String(no).padStart(2,"0");}
function stars(d){return "★".repeat(d)+'<i>'+"★".repeat(5-d)+'</i>';}
function okBadges(i){const n=OKN.has(lbl(i.no)),r=OKR.has(lbl(i.no));if(!n&&!r)return"";return '<span class="ok">'+(n?'<span class="n">縄なし✓</span>':'')+(r?'<span class="r">縄あり✓</span>':'')+'</span>';}
function subUrl(no,rt){return "https://line.me/R/oaMessage/%40"+OA+"/?"+encodeURIComponent("動画提出："+lbl(no)+"（"+rt+"）");}
if(U){fetch(GAS_URL+"?action=read&u="+encodeURIComponent(U),{credentials:"omit"}).then(r=>r.json()).then(j=>{if(j&&j.ok){(j.approvedNoRope||[]).forEach(k=>OKN.add(k));(j.approvedRope||[]).forEach(k=>OKR.add(k));drawGrid();}}).catch(()=>{});}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
// 見た記録（この端末だけ。使えない環境では何もしない）
let SEEN={};try{SEEN=JSON.parse(localStorage.getItem("choreo_seen")||"{}")||{};}catch(e){}
function markSeen(no){SEEN[no]=1;try{localStorage.setItem("choreo_seen",JSON.stringify(SEEN));}catch(e){}}
const OTHER=CHIPS.filter(t=>!ROAD.includes(t)).concat(Object.keys(DICT).filter(t=>!CHIPS.includes(t)&&!ROAD.includes(t)&&ITEMS.some(i=>i.tags.includes(t))));
function cnt(t){return ITEMS.filter(i=>i.tags.includes(t)).length;}
function chip(k,l,c){return '<button class="chip'+(filter===k?' on':'')+'" data-k="'+esc(k)+'">'+esc(l)+'<span class="c">'+c+'</span></button>';}
function drawChips(){
  let h=chip("all","すべて",ITEMS.length)+chip("easy","やさしい順",ITEMS.length)+ROAD.filter(t=>cnt(t)).map(t=>chip(t,t,cnt(t))).join("");
  const otherOn=OTHER.includes(filter);
  if(showMore||otherOn)h+=OTHER.map(t=>chip(t,t,cnt(t))).join("")+'<button class="chip more" id="lessBtn">閉じる</button>';
  else h+='<button class="chip more" id="moreBtn">その他の技 ›</button>';
  document.getElementById("chips").innerHTML=h;
}
function listFor(){
  let l=ITEMS.filter(i=>filter==="all"||filter==="easy"||i.tags.includes(filter));
  if(filter==="easy")l=l.slice().sort((a,b)=>(a.no===FIRST?-1:b.no===FIRST?1:a.dif-b.dif||a.no-b.no));
  return l;
}
function drawGrid(){
  const g=document.getElementById("grid"),list=listFor();
  document.getElementById("count").textContent=list.length+" 本"+(filter==="easy"?"（難しさ★の少ない順）":"");
  if(!list.length){g.innerHTML='<div class="empty">該当なし</div>';return;}
  g.innerHTML=list.map(i=>'<button class="card" aria-label="#'+i.no+' '+esc(i.tags.join('・'))+'" data-no="'+i.no+'"><div class="thumb" style="background-image:url('+i.img+')"><span class="play">▶</span>'+
    (i.no===FIRST?'<span class="badge">はじめの1本</span>':'')+(SEEN[i.no]?'<span class="seen">見た</span>':'')+okBadges(i)+'</div>'+
    '<div class="meta"><div class="tags">'+i.tags.map(t=>'<span class="tag'+(ROAD.includes(t)?' r':'')+'">'+esc(t)+'</span>').join("")+'</div><div class="stars">'+stars(i.dif)+'</div></div></button>').join("");
}
function drawDictBar(){
  const b=document.getElementById("dictBar");
  if(filter==="all"||filter==="easy"){b.style.display="none";return;}
  if(DICT[filter]){b.className="dictbar go";b.innerHTML='<b>'+esc(filter)+'</b>ってどんな技？　見本とコツ ›';}
  else{b.className="dictbar";b.innerHTML='<b>'+esc(filter)+'</b>は技辞典にまだありません。振付の解説動画の中で説明しています。';}
  b.style.display="block";
}
function setFilter(k){filter=k;drawChips();drawGrid();drawDictBar();}

// ---- モーダル ----
let SRC=[],from=null;
const modal=document.getElementById("modal"),mv=document.getElementById("mv"),mf=document.getElementById("mf");
function setRate(r){mv.defaultPlaybackRate=r;mv.playbackRate=r;document.querySelectorAll(".tool[data-rate]").forEach(b=>b.classList.toggle("on",+b.dataset.rate===r));}
function play(k){
  const x=SRC[k];
  if(x.yt){mv.pause();mv.hidden=true;mf.hidden=false;mf.src="https://www.youtube.com/embed/"+x.yt+"?autoplay=1&playsinline=1";document.getElementById("tools").style.display="none";}
  else{mf.src="";mf.hidden=true;mv.hidden=false;if(mv.getAttribute("src")!==x.v){mv.src=x.v;}const r=mv.playbackRate;mv.play().catch(()=>{});mv.playbackRate=r;document.getElementById("tools").style.display="flex";}
  document.querySelectorAll("#mbtns .mbtn").forEach((b,i)=>b.className="mbtn"+(i===k?" main":""));
}
function openModal(head,text,src){
  SRC=src;document.getElementById("mhead").innerHTML=head;
  const t=document.getElementById("mtext");if(text){t.innerHTML=text;t.hidden=false;}else{t.hidden=true;}
  document.getElementById("mbtns").innerHTML=src.length>1?src.map((x,i)=>'<button class="mbtn" data-i="'+i+'"'+(x.off?' disabled':'')+'>'+esc(x.l)+'</button>').join(""):"";
  if(modal.hidden){modal.hidden=false;document.body.style.overflow="hidden";try{history.pushState({m:1},"");}catch(e){}}
  modal.scrollTop=0;setRate(1);mv.classList.remove("mirror");document.getElementById("mirror").classList.remove("on");play(0);
}
function passHtml(c){
  const n=OKN.has(lbl(c.no)),r=OKR.has(lbl(c.no));
  let h='<div class="pass"><h4>合格のポイント'+(n?'<span class="got n">縄なし✓</span>':'')+(r?'<span class="got r">縄あり✓</span>':'')+'<span class="st">難しさ '+stars(c.dif)+'</span></h4><ol>'+c.chk.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol>'+
    '<div class="lv"><b>'+c.chk.length+'つ中'+Math.ceil(c.chk.length*0.6)+'つ</b>できたら合格。縄なしは止まらずに最後まで、縄ありは縄の中で最後まで（引っかかり1回までOK）</div></div>';
  h+='<div class="sub"><a href="'+subUrl(c.no,"縄なし")+'" target="_blank" rel="noopener">縄なし動画を提出</a><a class="r" href="'+subUrl(c.no,"縄あり")+'" target="_blank" rel="noopener">縄あり動画を提出</a></div>'+
    '<div class="subhint">LINEが開いたら、入った文をそのまま送る → 続けて動画を送る</div>';
  return h;
}
function tagBtns(tags){return tags.map(t=>'<button class="mtag'+(ROAD.includes(t)?' r':'')+(DICT[t]?' has':'')+'"'+(DICT[t]?' data-t="'+esc(t)+'"':'')+'>'+esc(t)+'</button>').join("");}
function openChoreo(no){
  const c=ITEMS.find(i=>i.no===no);if(!c)return;from=null;markSeen(no);
  openModal('<b>#'+String(c.no).padStart(2,"0")+'</b>　'+c.date+'　'+c.inst+'<br>'+tagBtns(c.tags),
    '<div class="try" style="margin-top:12px"><svg viewBox=\"0 0 24 24\"><path d=\"M3 18c3-14 15-14 18 0\"/><circle cx=\"12\" cy=\"9.5\" r=\"1.8\" fill=\"currentColor\" stroke=\"none\"/><path d=\"M12 11.5v4.5M12 13l-2.5 1.6M12 13l2.5 1.6M12 16l-2 3M12 16l2 3\"/></svg>8カウントだけ跳んでみよう</div>'+passHtml(c),[{l:"振付",v:c.v},c.yt?{l:"解説を見る（約"+Math.max(1,Math.round(c.sec/60))+"分）",yt:c.yt}:{l:"解説は準備中",off:true}]);
}
function openDict(t,back){
  const d=DICT[t];if(!d)return;from=back||null;
  const src=[{l:"縄の中の見本",v:d.v}];
  if(d.v2)src.push({l:"名前と由来",v:d.v2});
  if(d.yt)src.push({l:"ロードマップの解説",yt:d.yt});
  (d.ex||[]).forEach(e=>src.push({l:e[0],v:e[1]}));
  const n=cnt(t);
  openModal((from?'<button class="mback" id="mback">‹ #'+String(from).padStart(2,"0")+'に戻る</button><br>':'')+'<b style="font-size:17px;font-family:inherit">'+esc(t)+'</b>'+(d.road?'　<span style="color:#e8a27f;font-size:12px">ロードマップの技</span>':''),
    '<b>どんな技？</b> '+esc(d.d)+(d.tip?'<br><b>コツ</b> '+esc(d.tip):'')+(n?'<br><button class="mlink" id="mfilter" data-t2="'+esc(t)+'">この技が出てくる振付 '+n+'本を見る ›</button>':''),src);
}
function hideModal(){mv.pause();mv.removeAttribute("src");mv.load();mf.src="";modal.hidden=true;document.body.style.overflow="";from=null;}
function close_(){if(history.state&&history.state.m){history.back();}else{hideModal();}}
window.addEventListener("popstate",()=>{if(!modal.hidden)hideModal();});
let curChoreo=null;
document.getElementById("dictList").innerHTML=Object.keys(DICT).map(t=>'<button class="'+(DICT[t].road?'r':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>').join("");
document.addEventListener("click",e=>{
  const T=e.target;
  if(T.id==="moreBtn"){showMore=true;drawChips();return;}
  if(T.id==="lessBtn"){showMore=false;if(OTHER.includes(filter))setFilter("all");else drawChips();return;}
  const c=T.closest(".chip");if(c){setFilter(c.dataset.k);return;}
  if(T.closest(".dictbar.go")){openDict(filter);return;}
  if(T.id==="mback"){openChoreo(from);return;}
  if(T.id==="mfilter"){const t=T.dataset.t2;close_();setTimeout(()=>{setFilter(t);document.getElementById("chips").scrollIntoView({behavior:"smooth"});},60);return;}
  const dt=T.closest("[data-t]");if(dt&&DICT[dt.dataset.t]){const inChoreo=!modal.hidden&&curChoreo;openDict(dt.dataset.t,inChoreo?curChoreo:null);curChoreo=null;return;}
  const fb=T.closest(".first");if(fb){curChoreo=+fb.dataset.no;openChoreo(curChoreo);return;}
  const k=T.closest(".card");if(k){curChoreo=+k.dataset.no;openChoreo(curChoreo);drawGrid();return;}
  if(T.id==="mclose"){close_();return;}
  const rb=T.closest(".tool[data-rate]");if(rb){setRate(+rb.dataset.rate);return;}
  if(T.id==="mirror"){mv.classList.toggle("mirror");T.classList.toggle("on");return;}
  const mb=T.closest("#mbtns .mbtn");if(mb&&!mb.disabled){play(+mb.dataset.i);return;}
});
drawChips();drawGrid();
</script>
</body></html>
